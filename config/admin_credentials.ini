[smb_credentials]
# Credentials pour l'accès administrateur au SMB
username = adminsmiden
password = Us52uK
domain = SMIDEN
server = 172.16.252.34
share_name = Public


[crawler_config]
# Configuration du crawler pour tests et production
max_workers = 4
delay_between_requests = 0.1
max_depth = 10
large_file_threshold = 104857600
max_queue_size = 1000
pre_estimation_enabled = true
pre_estimation_mode = smb
pre_estimation_mount_path =

[database_config]
# Configuration de la base de données
db_path = openindex.db
backup_enabled = true
backup_interval_hours = 24

[logging_config]
# Configuration des logs
log_level = INFO
log_file = logs/openindex.log
max_log_size_mb = 10
backup_count = 5
