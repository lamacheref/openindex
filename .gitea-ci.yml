stages:
  # Build du crawler
  build-crawler:
    stage: build
    image: docker:24.0.5
    services:
      - docker:24.0.5-dind
    variables:
      DOCKER_DRIVER: overlay2
    script:
      - echo "🐳 Build de l'image crawler..."
      - docker build -f Dockerfile.crawler -t $CI_REGISTRY_IMAGE_CRAWLER:$CI_COMMIT_SHA .
      - docker tag $CI_REGISTRY_IMAGE_CRAWLER:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE_CRAWLER:latest
    only:
      - main
      - develop
      - /^release\/.*$/
    tags:
      - docker

  # Build de l'interface web
  build-web:
    stage: build
    image: docker:24.0.5
    services:
      - docker:24.0.5-dind
    variables:
      DOCKER_DRIVER: overlay2
    script:
      - echo "🌐 Build de l'image web UI..."
      - docker build -f Dockerfile.web -t $CI_REGISTRY_IMAGE_WEB:$CI_COMMIT_SHA .
      - docker tag $CI_REGISTRY_IMAGE_WEB:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE_WEB:latest
    only:
      - main
      - develop
      - /^release\/.*$/
    tags:
      - docker

  # Build de la stack complète
  build-stack:
    stage: build
    image: docker:24.0.5
    services:
      - docker:24.0.5-dind
    variables:
      DOCKER_DRIVER: overlay2
    script:
      - echo "🏗️ Build de la stack complète..."
      - docker build -f docker-compose.stack.yml -t $CI_REGISTRY_IMAGE_STACK:$CI_COMMIT_SHA .
      - docker tag $CI_REGISTRY_IMAGE_STACK:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE_STACK:latest
    only:
      - main
      - develop
      - /^release\/.*$/
    tags:
      - docker
    when: manual

  # Tests de l'image crawler
  test-crawler:
    stage: test
    image: $CI_REGISTRY_IMAGE_CRAWLER:$CI_COMMIT_SHA
    services:
      - postgres:15-alpine
    variables:
      POSTGRES_DB: test_openindex
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    script:
      - echo "🧪 Test de l'image crawler..."
      - python -c "
import psycopg2
import sys
try:
    conn = psycopg2.connect(
        host='$POSTGRES_HOST',
        port=$POSTGRES_PORT,
        database='$POSTGRES_DB',
        user='$POSTGRES_USER',
        password='$POSTGRES_PASSWORD'
    )
    conn.close()
    print('✅ Connexion PostgreSQL réussie')
except Exception as e:
    print(f'❌ Erreur connexion: {e}')
    sys.exit(1)
"
      - python src/smb_crawler_postgresql.py --help
    needs:
      - build-crawler
    tags:
      - test

  # Tests de l'image web
  test-web:
    stage: test
    image: $CI_REGISTRY_IMAGE_WEB:$CI_COMMIT_SHA
    services:
      - postgres:15-alpine
    variables:
      POSTGRES_DB: test_openindex
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    script:
      - echo "🌐 Test de l'image web UI..."
      - python -c "
import psycopg2
import sys
try:
    conn = psycopg2.connect(
        host='$POSTGRES_HOST',
        port=$POSTGRES_PORT,
        database='$POSTGRES_DB',
        user='$POSTGRES_USER',
        password='$POSTGRES_PASSWORD'
    )
    conn.close()
    print('✅ Connexion PostgreSQL réussie')
except Exception as e:
    print(f'❌ Erreur connexion: {e}')
    sys.exit(1)
"
      - timeout 30s streamlit run src/web_interface_v2.py --server.port=8502 --server.headless=true &
      - sleep 10
      - curl -f http://localhost:8502/_stcore/health || exit 1
    needs:
      - build-web
    tags:
      - test

  # Push des images en staging
  push-staging:
    stage: deploy
    image: docker:24.0.5
    variables:
      DOCKER_DRIVER: overlay2
    script:
      - echo "🚀 Push des images en staging..."
      - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      - docker push $CI_REGISTRY_IMAGE_CRAWLER:$CI_COMMIT_SHA
      - docker push $CI_REGISTRY_IMAGE_WEB:$CI_COMMIT_SHA
      - docker push $CI_REGISTRY_IMAGE_CRAWLER:latest
      - docker push $CI_REGISTRY_IMAGE_WEB:latest
    environment:
      name: staging
    only:
      - develop
    needs:
      - test-crawler
      - test-web
    tags:
      - docker

  # Push des images en production
  push-production:
    stage: deploy
    image: docker:24.0.5
    variables:
      DOCKER_DRIVER: overlay2
    script:
      - echo "🏭 Déploiement en production..."
      - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      - docker push $CI_REGISTRY_IMAGE_CRAWLER:$CI_COMMIT_SHA
      - docker push $CI_REGISTRY_IMAGE_WEB:$CI_COMMIT_SHA
      - docker push $CI_REGISTRY_IMAGE_CRAWLER:latest
      - docker push $CI_REGISTRY_IMAGE_WEB:latest
      - |
        echo "🏷️ Création du tag de release..."
        if [[ "$CI_COMMIT_TAG" != "" ]]; then
          docker tag $CI_REGISTRY_IMAGE_CRAWLER:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE_CRAWLER:$CI_COMMIT_TAG
          docker tag $CI_REGISTRY_IMAGE_WEB:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE_WEB:$CI_COMMIT_TAG
          docker push $CI_REGISTRY_IMAGE_CRAWLER:$CI_COMMIT_TAG
          docker push $CI_REGISTRY_IMAGE_WEB:$CI_COMMIT_TAG
          echo "✅ Tags de release créés: $CI_COMMIT_TAG"
        fi
    environment:
      name: production
    only:
      - main
      - /^release\/.*$/
    needs:
      - test-crawler
      - test-web
    tags:
      - docker

  # Nettoyage des anciennes images
  cleanup:
    stage: .post
    image: docker:24.0.5
    services:
      - docker:24.0.5-dind
    variables:
      DOCKER_DRIVER: overlay2
    script:
      - echo "🧹 Nettoyage des anciennes images..."
      - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      - |
        # Garder seulement les 10 dernières images
        docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}" --filter "reference=$CI_REGISTRY_IMAGE_CRAWLER" | tail -n +11 | awk '{print $3}' | xargs -r docker rmi
        docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}" --filter "reference=$CI_REGISTRY_IMAGE_WEB" | tail -n +11 | awk '{print $3}' | xargs -r docker rmi
    when: always
    tags:
      - docker

variables:
  CI_REGISTRY_IMAGE_CRAWLER: $CI_REGISTRY/openindex-crawler
  CI_REGISTRY_IMAGE_WEB: $CI_REGISTRY/openindex-web
  CI_REGISTRY_IMAGE_STACK: $CI_REGISTRY/openindex-stack
