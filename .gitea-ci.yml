variables:
  DOCKER_DRIVER: overlay2
  CI_REGISTRY_IMAGE_CRAWLER: $CI_REGISTRY/openindex-crawler
  CI_REGISTRY_IMAGE_UI: $CI_REGISTRY/openindex-ui

stages:
  - build
  - deploy

# Build conditionnel crawler: uniquement si ses fichiers (ou dépendances partagées) changent
build-crawler:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop)$/ || $CI_COMMIT_BRANCH =~ /^release\/.*$/'
      changes:
        - Dockerfile.crawler
        - requirements.txt
        - src/**
        - config/**
        - database/**
        - .gitea-ci.yml
    - when: never
  script:
    - echo "🐳 Build image crawler (changement détecté)..."
    - docker build -f Dockerfile.crawler -t $CI_REGISTRY_IMAGE_CRAWLER:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE_CRAWLER:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE_CRAWLER:latest
    - docker run --rm $CI_REGISTRY_IMAGE_CRAWLER:$CI_COMMIT_SHA python -m py_compile src/smb_crawler_postgresql.py
  tags:
    - docker

# Build conditionnel UI Nginx: uniquement si ses fichiers changent
build-ui:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop)$/ || $CI_COMMIT_BRANCH =~ /^release\/.*$/'
      changes:
        - Dockerfile.frontend
        - frontend/**
        - nginx/**
        - .gitea-ci.yml
    - when: never
  script:
    - echo "🌐 Build image UI Nginx (changement détecté)..."
    - docker build -f Dockerfile.frontend -t $CI_REGISTRY_IMAGE_UI:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE_UI:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE_UI:latest
    - docker run -d --name openindex-ui-ci -p 3000:3000 $CI_REGISTRY_IMAGE_UI:$CI_COMMIT_SHA
    - sleep 5
    - wget -qO- http://localhost:3000/health | grep -q "healthy"
    - docker rm -f openindex-ui-ci
  tags:
    - docker

# Push crawler seulement si construit
push-crawler:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop)$/ || $CI_COMMIT_BRANCH =~ /^release\/.*$/'
      changes:
        - Dockerfile.crawler
        - requirements.txt
        - src/**
        - config/**
        - database/**
        - .gitea-ci.yml
    - when: never
  needs:
    - build-crawler
  script:
    - echo "🚀 Push image crawler"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE_CRAWLER:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE_CRAWLER:latest
  tags:
    - docker

# Push UI seulement si construite
push-ui:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop)$/ || $CI_COMMIT_BRANCH =~ /^release\/.*$/'
      changes:
        - Dockerfile.frontend
        - frontend/**
        - nginx/**
        - .gitea-ci.yml
    - when: never
  needs:
    - build-ui
  script:
    - echo "🚀 Push image UI"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE_UI:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE_UI:latest
  tags:
    - docker
