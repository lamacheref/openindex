# Docker Compose pour les tests CI/CD
version: '3.8'

services:
  # Base de données PostgreSQL pour les tests
  postgres-test:
    image: postgres:17-alpine
    container_name: openindex-postgres-test
    environment:
      POSTGRES_DB: test_openindex
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - test-network

  # Service pour tester l'image crawler
  test-crawler:
    image: ${CI_REGISTRY_IMAGE_CRAWLER:-openindex-crawler:latest}
    container_name: test-crawler
    environment:
      # Configuration PostgreSQL de test
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_openindex
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      SMB_SERVER: fake-server
      SMB_SHARE: test-share
      SMB_DOMAIN: TEST
      SMB_USERNAME: testuser
      SMB_PASSWORD: testpass
      DEBUG_MODE: "true"
    depends_on:
      - postgres-test
    networks:
      - test-network
    command: ["--help"]

  # Service pour tester l'image web
  test-web:
    image: ${CI_REGISTRY_IMAGE_WEB:-openindex-web:latest}
    container_name: test-web
    environment:
      # Configuration PostgreSQL de test
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_openindex
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      STREAMLIT_SERVER_PORT: 8502
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    depends_on:
      - postgres-test
    networks:
      - test-network
    command: ["streamlit", "run", "src/web_interface_v2.py", "--server.headless=true", "--server.port=8502"]

networks:
  test-network:
    driver: bridge
