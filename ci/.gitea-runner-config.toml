# Configuration Gitea Runner
# Fichier pour configurer un runner Gitea auto-hébergé

[[runners]]
  name = "openindex-docker-runner"
  url = "https://git.example.com"
  token = "glpat-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  executor = "docker"
  
  [runners.docker]
    host = "/var/run/docker.sock"
    privileged = true
    volumes = ["/cache"]
    network_mode = "host"
    
  [[runners.docker.volumes]]
    name = "openindex-cache"
    host_path = "/var/cache/openindex"
    container_path = "/cache"
    type = "volume"

[[runners.custom]]
  run_exec = """
    echo "🔄 Nettoyage du cache..."
    rm -rf /cache/*
    
    echo "📦 Installation des dépendances..."
    docker info
    
    echo "✅ Runner prêt pour OpenIndex"
  """
