# version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: openindex-postgres
    restart: unless-stopped
    environment:
      TZ: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      POSTGRES_DB: ${POSTGRES_DB:-openindex}
      POSTGRES_USER: ${POSTGRES_USER:-openindex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - openindex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openindex_user} -d ${POSTGRES_DB:-openindex}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.6.0}
        OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-dev}
        OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
    image: openindex-api:local
    container_name: openindex-api
    restart: unless-stopped
    environment:
      TZ: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_TIMEZONE: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.6.0}
      OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-dev}
      OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
      OPENINDEX_DB_BACKEND: postgresql
      OPENINDEX_CRAWLER_LOG_PATH: /app/logs/smb_crawler_postgresql.log
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-openindex}
      POSTGRES_USER: ${POSTGRES_USER:-openindex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${OPENINDEX_API_PORT:-8000}:8000"
    volumes:
      - logs_data:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - openindex-network

  crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
      args:
        OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.6.0}
        OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-dev}
        OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
    image: openindex-crawler:local
    container_name: openindex-crawler
    restart: unless-stopped
    environment:
      TZ: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_TIMEZONE: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.6.0}
      OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-dev}
      OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-openindex}
      POSTGRES_USER: ${POSTGRES_USER:-openindex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - logs_data:/app/logs
      - ./config:/app/config:ro
    networks:
      - openindex-network

  ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.6.0}
        OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-dev}
        OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
    image: openindex-ui:local
    container_name: openindex-ui
    restart: unless-stopped
    environment:
      TZ: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_TIMEZONE: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.6.0}
      OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-dev}
      OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
      POCKETBASE_URL: http://pocketbase:8090
    ports:
      - "${OPENINDEX_UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
      pocketbase:
        condition: service_started
    networks:
      - openindex-network

  # PocketBase - Authentication & Authorization
  pocketbase:
    image: adrianmusante/pocketbase:latest
    container_name: openindex-pocketbase
    restart: unless-stopped
    environment:
      TZ: ${OPENINDEX_TIMEZONE:-Europe/Paris}
    volumes:
      - pocketbase_data:/pb/pb_data
    ports:
      - "${POCKETBASE_PORT:-8090}:8090"
    networks:
      - openindex-network

  # T-ARCH-02: Archive Transfer Worker
  archive-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.6.0}
        OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-dev}
        OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
    image: openindex-archive-worker:local
    container_name: openindex-archive-worker
    restart: unless-stopped
    environment:
      TZ: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_TIMEZONE: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.6.0}
      OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-dev}
      OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-openindex}
      POSTGRES_USER: ${POSTGRES_USER:-openindex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
      ARCHIVE_WORKER_POLL_INTERVAL: ${ARCHIVE_WORKER_POLL_INTERVAL:-5}
      ARCHIVE_WORKER_MAX_CONCURRENT: ${ARCHIVE_WORKER_MAX_CONCURRENT:-3}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - logs_data:/app/logs
    networks:
      - openindex-network

  # T-ARCH-02: Archive Scheduler
  archive-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
      args:
        OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.6.0}
        OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-dev}
        OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
    image: openindex-archive-scheduler:local
    container_name: openindex-archive-scheduler
    restart: unless-stopped
    environment:
      TZ: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_TIMEZONE: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.6.0}
      OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-dev}
      OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-openindex}
      POSTGRES_USER: ${POSTGRES_USER:-openindex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
      ARCHIVE_SCHEDULER_POLL_INTERVAL: ${ARCHIVE_SCHEDULER_POLL_INTERVAL:-60}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - logs_data:/app/logs
    networks:
      - openindex-network

volumes:
  postgres_data:
    driver: local
  logs_data:
    driver: local
  pocketbase_data:
    driver: local

networks:
  openindex-network:
    driver: bridge
