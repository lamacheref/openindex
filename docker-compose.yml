version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: openindex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openindex}
      POSTGRES_USER: ${POSTGRES_USER:-openindex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - openindex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openindex_user} -d ${POSTGRES_DB:-openindex}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  api:
    image: ${OPENINDEX_API_IMAGE:-ghcr.io/OWNER/openindex-api:latest}
    container_name: openindex-api
    restart: unless-stopped
    environment:
      OPENINDEX_DB_BACKEND: postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-openindex}
      POSTGRES_USER: ${POSTGRES_USER:-openindex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${OPENINDEX_API_PORT:-8000}:8000"
    networks:
      - openindex-network

  crawler:
    image: ${OPENINDEX_CRAWLER_IMAGE:-ghcr.io/OWNER/openindex-crawler:latest}
    container_name: openindex-crawler
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-openindex}
      POSTGRES_USER: ${POSTGRES_USER:-openindex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - openindex-network

  ui:
    image: ${OPENINDEX_UI_IMAGE:-ghcr.io/OWNER/openindex-ui:latest}
    container_name: openindex-ui
    restart: unless-stopped
    ports:
      - "${OPENINDEX_UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - openindex-network

volumes:
  postgres_data:
    driver: local

networks:
  openindex-network:
    driver: bridge
