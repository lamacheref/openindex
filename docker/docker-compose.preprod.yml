# Stack preproduction.
# Usage attendu:
#   docker compose --env-file .env.preprod -f docker-compose.preprod.yml pull
#   docker compose --env-file .env.preprod -f docker-compose.preprod.yml up -d
# Auth GHCR:
#   effectuer un docker login ghcr.io avant le pull si les packages sont privés

services:
  postgres:
    image: postgres:17-alpine
    container_name: openindex-postgres-preprod
    restart: unless-stopped
    environment:
      TZ: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      POSTGRES_DB: ${POSTGRES_DB:-openindex}
      POSTGRES_USER: ${POSTGRES_USER:-openindex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_preprod:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - openindex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openindex_user} -d ${POSTGRES_DB:-openindex}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  api:
    image: ${OPENINDEX_API_IMAGE:-ghcr.io/lamacheref/openindex-api:0.3.29}
    container_name: openindex-api-preprod
    restart: unless-stopped
    environment:
      TZ: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_TIMEZONE: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.3.29}
      OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-preprod}
      OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
      OPENINDEX_DB_BACKEND: postgresql
      OPENINDEX_CRAWLER_LOG_PATH: /app/logs/smb_crawler_postgresql.log
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-openindex}
      POSTGRES_USER: ${POSTGRES_USER:-openindex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${OPENINDEX_API_PORT:-8000}:8000"
    volumes:
      - logs_data_preprod:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - openindex-network

  crawler:
    image: ${OPENINDEX_CRAWLER_IMAGE:-ghcr.io/lamacheref/openindex-crawler:0.4.2}
    container_name: openindex-crawler-preprod
    restart: unless-stopped
    environment:
      TZ: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_TIMEZONE: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.4.2}
      OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-preprod}
      OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-openindex}
      POSTGRES_USER: ${POSTGRES_USER:-openindex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - logs_data_preprod:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - openindex-network

  ui:
    image: ${OPENINDEX_UI_IMAGE:-ghcr.io/lamacheref/openindex-ui:0.3.29}
    container_name: openindex-ui-preprod
    restart: unless-stopped
    environment:
      TZ: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_TIMEZONE: ${OPENINDEX_TIMEZONE:-Europe/Paris}
      OPENINDEX_APP_VERSION: ${OPENINDEX_APP_VERSION:-0.3.29}
      OPENINDEX_BUILD_COMMIT: ${OPENINDEX_BUILD_COMMIT:-preprod}
      OPENINDEX_BUILD_DATE: ${OPENINDEX_BUILD_DATE:-unknown}
    ports:
      - "${OPENINDEX_UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - openindex-network

volumes:
  postgres_data_preprod:
    driver: local
  logs_data_preprod:
    driver: local

networks:
  openindex-network:
    driver: bridge
