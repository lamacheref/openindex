name: Docker Images CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'Dockerfile.crawler'
      - 'Dockerfile.frontend'
      - 'requirements.txt'
      - 'src/**'
      - 'config/**'
      - 'database/**'
      - 'frontend/**'
      - 'nginx/**'
      - '.github/workflows/docker-j3.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile.crawler'
      - 'Dockerfile.frontend'
      - 'requirements.txt'
      - 'src/**'
      - 'config/**'
      - 'database/**'
      - 'frontend/**'
      - 'nginx/**'
      - '.github/workflows/docker-j3.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_CRAWLER: ${{ github.repository_owner }}/openindex-crawler
  IMAGE_UI: ${{ github.repository_owner }}/openindex-ui

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      crawler: ${{ steps.filter.outputs.crawler }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            crawler:
              - 'Dockerfile.crawler'
              - 'requirements.txt'
              - 'src/**'
              - 'config/**'
              - 'database/**'
            ui:
              - 'Dockerfile.frontend'
              - 'frontend/**'
              - 'nginx/**'

  docker-build-crawler:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.crawler == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (crawler)
        id: meta-crawler
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_CRAWLER }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.crawler
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-crawler.outputs.tags }}
          labels: ${{ steps.meta-crawler.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-ui:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (ui)
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_UI }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
