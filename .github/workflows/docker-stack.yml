name: Docker Stack CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'Dockerfile.api'
      - 'Dockerfile.crawler'
      - 'Dockerfile.frontend'
      - 'Archives/legacy/requirements/requirements.crawler.txt'
      - 'src/**'
      - 'config/**'
      - 'database/**'
      - 'frontend/**'
      - 'nginx/**'
      - '.github/workflows/docker-stack.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile.api'
      - 'Dockerfile.crawler'
      - 'Dockerfile.frontend'
      - 'Archives/legacy/requirements/requirements.crawler.txt'
      - 'src/**'
      - 'config/**'
      - 'database/**'
      - 'frontend/**'
      - 'nginx/**'
      - '.github/workflows/docker-stack.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository_owner }}/openindex-api
  IMAGE_CRAWLER: ${{ github.repository_owner }}/openindex-crawler
  IMAGE_UI: ${{ github.repository_owner }}/openindex-ui

jobs:
  api-tests-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openindex
          POSTGRES_USER: openindex_user
          POSTGRES_PASSWORD: openindex_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U openindex_user -d openindex"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      OPENINDEX_DB_BACKEND: postgresql
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: openindex
      POSTGRES_USER: openindex_user
      POSTGRES_PASSWORD: openindex_secure_password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run API tests
        run: |
          pytest -q tests/test_api_fastapi.py tests/test_api_smoke_critical.py tests/test_db_backend_feature_flag.py

  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      crawler: ${{ steps.filter.outputs.crawler }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'Dockerfile.api'
              - 'src/api/**'
              - 'src/postgres_adapter.py'
              - 'src/config_manager.py'
              - 'src/logging_config.py'
              - 'config/**'
            crawler:
              - 'Dockerfile.crawler'
              - 'Archives/legacy/requirements/requirements.crawler.txt'
              - 'src/**'
              - 'config/**'
              - 'database/**'
            ui:
              - 'Dockerfile.frontend'
              - 'frontend/**'
              - 'nginx/**'

  docker-build-api:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-crawler:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.crawler == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (crawler)
        id: meta-crawler
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_CRAWLER }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.crawler
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-crawler.outputs.tags }}
          labels: ${{ steps.meta-crawler.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-ui:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (ui)
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_UI }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
