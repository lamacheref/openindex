# Docker Compose pour OpenIndex complet
# Inclut crawler PostgreSQL + interface web + monitoring

version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: openindex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openindex
      POSTGRES_USER: openindex_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - openindex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openindex_user -d openindex"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Interface pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: openindex-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@openindex.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - openindex-network
    depends_on:
      - postgres

  # Application OpenIndex complète
  openindex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openindex-app
    restart: unless-stopped
    environment:
      # Configuration PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: openindex
      POSTGRES_USER: openindex_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openindex_secure_password}
      
      # Configuration Streamlit
      STREAMLIT_SERVER_PORT: 8502
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      LOG_LEVEL: info
      
      # Configuration Crawler
      WORKERS: ${CRAWLER_WORKERS:-4}
      SHARE: ${SMB_SHARE:-Public\\SEPM}
      DEBUG: ${DEBUG_MODE:-false}
    volumes:
      - ./logs:/app/logs
      - ./archives:/app/archives
      - ./config:/app/config
      - openindex_data:/app/data
    ports:
      - "8502:8502"
    networks:
      - openindex-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8502/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Monitoring optionnel avec Grafana
  monitoring:
    image: grafana/grafana:latest
    container_name: openindex-monitoring
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - openindex-network
    profiles:
      - monitoring  # Optionnel

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  openindex_data:
    driver: local
  grafana_data:
    driver: local

networks:
  openindex-network:
    driver: bridge
